<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151820"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FAFB"/>
      <stop offset="60%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="printGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF"/>
      <stop offset="50%" stop-color="#E600A9"/>
      <stop offset="100%" stop-color="#FFE600"/>
    </linearGradient>
    <filter id="shirtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="16" fill="url(#bgGrad3)"/>
  
  <!-- Shadow below shirt -->
  <ellipse cx="200" cy="275" rx="90" ry="14" fill="#000000" opacity="0.4"/>

  <!-- T-Shirt Body -->
  <g filter="url(#shirtShadow)">
    <path d="M 140,55 
             C 170,75 230,75 260,55 
             L 320,95 L 290,145 L 260,135 L 260,265 
             C 260,270 140,270 140,265 
             L 140,135 L 110,145 L 80,95 Z" 
          fill="url(#shirtGrad)"/>
    
    <!-- Collar -->
    <path d="M 170,57 C 185,75 215,75 230,57 C 220,70 180,70 170,57 Z" fill="#D1D5DB"/>
    <path d="M 170,57 C 185,82 215,82 230,57" fill="none" stroke="#E5E7EB" stroke-width="2"/>
    
    <!-- Sleeves seams -->
    <path d="M 260,135 L 245,95" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M 140,135 L 155,95" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Sublimation Artwork On Chest -->
  <g transform="translate(160, 115)">
    <rect x="0" y="0" width="80" height="95" rx="8" fill="url(#printGrad)"/>
    <rect x="4" y="4" width="72" height="87" rx="6" fill="#151820" opacity="0.85"/>
    <!-- Graphic elements -->
    <circle cx="40" cy="40" r="22" fill="none" stroke="#00CFFF" stroke-width="3"/>
    <polygon points="40,25 50,48 25,32 55,32 30,48" fill="#FFE600"/>
    <text x="40" y="74" font-family="'Manrope', sans-serif" font-weight="900" font-size="8" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ROCKY</text>
  </g>

  <!-- Fabric wrinkle highlights for realism -->
  <path d="M 148,160 Q 155,185 146,210" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M 252,165 Q 244,195 254,220" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.5"/>
</svg>
