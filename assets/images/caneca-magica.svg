<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151820"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </linearGradient>
    <linearGradient id="magicBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D3039"/>
      <stop offset="25%" stop-color="#1F222B"/>
      <stop offset="70%" stop-color="#161820"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>
    <linearGradient id="subliReveal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#00CFFF"/>
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Steam from hot drink -->
  <path d="M 160,75 Q 150,45 170,25" fill="none" stroke="url(#steamGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 185,70 Q 200,40 180,15" fill="none" stroke="url(#steamGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 210,75 Q 220,50 205,30" fill="none" stroke="url(#steamGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Shadow below mug -->
  <ellipse cx="190" cy="265" rx="85" ry="18" fill="#000000" opacity="0.6"/>

  <!-- Handle -->
  <path d="M 240,110 C 310,110 310,210 240,210" fill="none" stroke="#252830" stroke-width="26" stroke-linecap="round"/>
  <path d="M 240,110 C 310,110 310,210 240,210" fill="none" stroke="#181A22" stroke-width="16" stroke-linecap="round"/>

  <!-- Mug Body -->
  <g filter="url(#dropShadow)">
    <path d="M 110,95 L 110,230 C 110,255 250,255 250,230 L 250,95 Z" fill="url(#magicBody)"/>
    <ellipse cx="180" cy="95" rx="70" ry="18" fill="#1C1E26"/>
    <ellipse cx="180" cy="95" rx="66" ry="15" fill="#4B382A"/>
  </g>

  <!-- Heat revealing sublimation section -->
  <g clip-path="url(#magicClip)">
    <clipPath id="magicClip">
      <path d="M 115,120 L 115,225 C 120,245 240,245 245,225 L 245,120 Z"/>
    </clipPath>
    <!-- Reveal Gradient -->
    <rect x="110" y="115" width="140" height="135" fill="url(#subliReveal)"/>
    <path d="M 120,135 Q 180,180 240,130 L 245,230 L 115,230 Z" fill="#FFE600" opacity="0.25"/>
    <text x="180" y="180" font-family="'Manrope', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">REVELA COM</text>
    <text x="180" y="200" font-family="'Manrope', sans-serif" font-weight="800" font-size="12" fill="#FFE600" text-anchor="middle">CALOR 🔥</text>
  </g>

  <!-- Highlight gloss -->
  <path d="M 122,105 L 126,230" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
</svg>
